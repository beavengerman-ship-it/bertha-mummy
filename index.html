<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bg: #fff0f5;
            --heart-red: #ff4d6d;
            --soft-pink: #ff8fa3;
            --text-color: #590d22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--pink-bg);
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 60px;
            position: relative;
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            font-size: 1.4rem;
            user-select: none;
            pointer-events: none;
            animation: floatUp 7s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header */
        header {
            text-align: center;
            margin: 40px 20px 20px;
            z-index: 1;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--heart-red);
            text-shadow: 2px 2px 4px rgba(255, 77, 109, 0.2);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--soft-pink);
            font-weight: 600;
        }

        /* Music Controls */
        .music-bar {
            margin-bottom: 35px;
            z-index: 1;
        }

        .music-btn {
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
        }

        /* Polaroid Gallery */
        .gallery-grid {
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            z-index: 1;
            padding: 10px;
        }

        .polaroid {
            background: #ffffff;
            padding: 18px 18px 28px 18px;
            border-radius: 16px;
            box-shadow: 0 12px 25px rgba(255, 143, 163, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 550px;
            width: 100%;
        }

        .polaroid:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 35px rgba(255, 77, 109, 0.4);
        }

        .polaroid img {
            width: 100%;
            height: auto;
            max-height: 550px;
            object-fit: cover;
            border-radius: 10px;
        }

        .caption {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--text-color);
            margin-top: 18px;
            text-align: center;
        }

        .date-tag {
            font-size: 0.95rem;
            color: var(--soft-pink);
            margin-top: 4px;
            font-weight: 600;
        }

        /* Lightbox Overlay */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(89, 13, 34, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            border: 6px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .lightbox-caption {
            font-family: 'Dancing Script', cursive;
            color: #fff;
            font-size: 2.4rem;
            margin-top: 15px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
        }

        /* Initial Tap Overlay */
        .autoplay-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 240, 245, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .start-heart {
            font-size: 4rem;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .start-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--heart-red);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Tap Overlay -->
    <div class="autoplay-overlay" id="overlay" onclick="startAudio()">
        <div class="start-heart">💖</div>
        <div class="start-text">Click anywhere to view our love story ✨</div>
    </div>

    <!-- Local Audio Element -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <header>
        <h1>Our Cute Love Story 💕</h1>
        <p class="subtitle">Every single second with you is magic ✨</p>
    </header>

    <div class="music-bar">
        <button class="music-btn" id="music-btn" onclick="toggleAudio()">🔊 Pause Music</button>
    </div>

    <!-- Polaroid Gallery -->
    <div class="gallery-grid">
        <div class="polaroid" onclick="openLightbox()">
            <img src="photo.jpg" alt="Our Special Moment">
            <div class="caption">Warm Hugs & Forever Love 💕</div>
            <div class="date-tag">My Favorite Place is in Your Arms</div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="lightbox-img" src="photo.jpg" alt="Enlarged Photo">
        <div class="lightbox-caption">Warm Hugs & Forever Love 💕</div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const overlay = document.getElementById('overlay');
        const musicBtn = document.getElementById('music-btn');

        function startAudio() {
            audio.play().then(() => {
                overlay.style.display = 'none';
                musicBtn.innerText = '🔊 Pause Music';
            }).catch(err => {
                console.log("Error playing audio:", err);
                overlay.style.display = 'none';
            });
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicBtn.innerText = '🔊 Pause Music';
            } else {
                audio.pause();
                musicBtn.innerText = '🎵 Play Music';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['💖', '💕', '💗', '❤️', '🌸', '✨'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 500);

        function openLightbox() {
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
