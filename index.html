<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Picture & Sound Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 17, 26, 0.75);
            backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            max-width: 320px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #64ffda;
            margin-bottom: 2px;
        }

        p.subtitle {
            font-size: 0.75rem;
            color: #8892b0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: #ccd6f6;
            font-weight: 500;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid #64ffda;
            color: #64ffda;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .btn:hover {
            background: rgba(100, 255, 218, 0.25);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        input[type="file"] {
            display: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #64ffda;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div>
            <h1>3D Picture Viewer</h1>
            <p class="subtitle">Convert 2D Images into 3D Depth Scenes</p>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="document.getElementById('file-input').click()">
                📂 Upload Photo
            </button>
            <input type="file" id="file-input" accept="image/*">
            <button class="btn" id="audio-btn">
                🎵 Play Music
            </button>
        </div>

        <div class="control-group">
            <label for="depth-slider">3D Depth Effect</label>
            <input type="range" id="depth-slider" min="0" max="3" step="0.1" value="1">
        </div>
    </div>

    <div class="hint">🖱️ Move mouse / drag to view in 3D perspective</div>

    <!-- Load Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Setup Three.js Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0c10, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x64ffda, 1, 20);
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        // Group for image layers
        const imageGroup = new THREE.Group();
        scene.add(imageGroup);

        let bgMesh, fgMesh;
        let currentDepthMultiplier = 1;

        // Default Canvas Texture
        function createDefaultTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
            grad.addColorStop(0, '#1a1c29');
            grad.addColorStop(0.5, '#0d1b2a');
            grad.addColorStop(1, '#1b263b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = '#64ffda';
            ctx.beginPath();
            ctx.arc(512, 512, 200, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // Build 3D depth planes from texture
        function build3DPlanes(texture) {
            while (imageGroup.children.length > 0) {
                imageGroup.remove(imageGroup.children[0]);
            }

            const aspect = texture.image ? (texture.image.width / texture.image.height) : 1;
            const width = 4 * aspect;
            const height = 4;

            // Background plane
            const bgGeo = new THREE.PlaneGeometry(width * 1.2, height * 1.2);
            const bgMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.8,
                metalness: 0.1
            });
            bgMesh = new THREE.Mesh(bgGeo, bgMat);
            bgMesh.position.z = -0.5;
            imageGroup.add(bgMesh);

            // Foreground plane layer (Simulated spatial depth)
            const fgGeo = new THREE.PlaneGeometry(width, height, 32, 32);
            const fgMat = new THREE.MeshStandardMaterial({
                map: texture,
                transparent: true,
                opacity: 0.9,
                roughness: 0.3
            });
            fgMesh = new THREE.Mesh(fgGeo, fgMat);
            fgMesh.position.z = 0.5;
            imageGroup.add(fgMesh);
        }

        // Initialize default texture
        const defaultTex = createDefaultTexture();
        build3DPlanes(defaultTex);

        // Particle System
        const particleCount = 150;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 15;
            positions[i + 1] = (Math.random() - 0.5) * 15;
            positions[i + 2] = (Math.random() - 0.5) * 15;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x64ffda,
            size: 0.04,
            transparent: true,
            opacity: 0.6
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Interaction setup
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // Depth Slider Listener
        document.getElementById('depth-slider').addEventListener('input', (e) => {
            currentDepthMultiplier = parseFloat(e.target.value);
            if (fgMesh && bgMesh) {
                fgMesh.position.z = 0.5 * currentDepthMultiplier;
                bgMesh.position.z = -0.5 * currentDepthMultiplier;
            }
        });

        // Custom Image Upload Handle
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const texture = new THREE.Texture(img);
                    texture.needsUpdate = true;
                    build3DPlanes(texture);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Ambient Audio Generator (Web Audio API)
        let audioCtx, isPlaying = false, synthInterval;

        function playAmbientSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // C, D, E, G, A pentatonic

            synthInterval = setInterval(() => {
                if (!isPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const note = notes[Math.floor(Math.random() * notes.length)];
                osc.type = 'sine';
                osc.frequency.setValueAtTime(note / 2, audioCtx.currentTime);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 4);
            }, 1200);
        }

        document.getElementById('audio-btn').addEventListener('click', () => {
            const btn = document.getElementById('audio-btn');
            if (!isPlaying) {
                isPlaying = true;
                playAmbientSound();
                btn.innerText = '⏸ Pause Music';
            } else {
                isPlaying = false;
                clearInterval(synthInterval);
                btn.innerText = '🎵 Play Music';
            }
        });

        // Window resize handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            imageGroup.rotation.y = targetX * 0.4;
            imageGroup.rotation.x = -targetY * 0.4;

            particles.rotation.y += 0.001;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
